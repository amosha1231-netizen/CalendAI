# Builds the iOS app on a GitHub macOS runner and uploads it to TestFlight.
# Run it by hand: GitHub > Actions > "iOS to TestFlight" > Run workflow.
#
# Needs three repository secrets (Settings > Secrets and variables > Actions),
# from an App Store Connect API key (Users and Access > Integrations >
# App Store Connect API > Team Keys, role Admin):
#   ASC_KEY_ID       the key's Key ID
#   ASC_ISSUER_ID    the Issuer ID shown above the keys table
#   ASC_KEY_P8       the full text of the downloaded AuthKey_XXXX.p8 file
# Signing is automatic (cloud-managed certificates), so no certificate or
# provisioning profile has to be stored here.
name: iOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (leave empty to use the run number). Must be higher than the last upload."
        required: false
        default: ""

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TEAM_ID: 3HZ7Y98XYW
      PROJECT: frontend/ios/App/App.xcodeproj
      SCHEME: App
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build web app and sync iOS project
        working-directory: frontend
        run: |
          npm ci
          npm run cap:build:ios

      - name: Install App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::Missing ASC_KEY_ID / ASC_KEY_P8 secrets (see the top of this file)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/asc"
          # Accept the .p8 text however it was pasted: with Windows line
          # endings, squashed onto one line, without the BEGIN/END lines, or
          # base64-encoded as a whole file. Rebuild a clean PEM from it.
          python3 - "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" <<'PY'
          import base64, os, re, sys
          raw = os.environ["ASC_KEY_P8"].strip()
          if "PRIVATE KEY" not in raw:
              try:
                  decoded = base64.b64decode(re.sub(r"\s+", "", raw), validate=True).decode()
                  if "PRIVATE KEY" in decoded:
                      raw = decoded
              except Exception:
                  pass
          body = re.sub(r"-----(BEGIN|END)[A-Z ]*-----", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          try:
              der = base64.b64decode(body, validate=True)
          except Exception:
              der = b""
          if len(der) < 100:
              sys.exit("::error::ASC_KEY_P8 does not look like a .p8 key. Paste the whole AuthKey_XXXX.p8 file text, including the BEGIN and END lines.")
          lines = [body[i:i + 64] for i in range(0, len(body), 64)]
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END PRIVATE KEY-----\n"
          open(sys.argv[1], "w").write(pem)
          print(f"Key file written ({len(der)} bytes of key data).")
          PY
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
        run: |
          echo "Build number: $BUILD_NUMBER"
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Upload to App Store Connect (TestFlight)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
