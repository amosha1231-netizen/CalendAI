# Compiles the iOS app for the simulator (no signing, no upload) whenever a pull
# request changes the native iOS project, so Swift errors show up before merge
# instead of in the "iOS to TestFlight" run.
name: iOS build check

on:
  pull_request:
    paths:
      - "frontend/ios/**"
      - ".github/workflows/ios-build-check.yml"
  workflow_dispatch:

concurrency:
  group: ios-build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build web app and sync iOS project
        working-directory: frontend
        run: |
          npm ci
          npm run cap:build:ios

      - name: Compile for the iOS simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project frontend/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 200

      - name: Check the Siri phrases made it into the app
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name "App.app" -type d | head -n 1)
          echo "App bundle: $APP"
          ls "$APP/Metadata.appintents" || { echo "::error::No App Intents metadata in the app (Siri action missing)."; exit 1; }
          ls "$APP/he.lproj"
          test -f "$APP/he.lproj/AppShortcuts.strings" || { echo "::error::Hebrew Siri phrases missing from the app."; exit 1; }
