# Sets up external TestFlight testing with a public link (see
# scripts/asc/testflight_public_link.py). Safe to re-run.
name: TestFlight public link

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number to share (empty = newest valid build)"
        required: false
        default: ""
  push:
    branches: ["claude/project-thread-q6z98t"]
    paths: ["scripts/asc/**", ".github/workflows/testflight-public-link.yml"]

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          python3 - "$RUNNER_TEMP/asc/key.p8" <<'PY'
          import base64, os, re, sys
          raw = os.environ["ASC_KEY_P8"].strip()
          if "PRIVATE KEY" not in raw:
              try:
                  d = base64.b64decode(re.sub(r"\s+", "", raw), validate=True).decode()
                  if "PRIVATE KEY" in d: raw = d
              except Exception: pass
          body = re.sub(r"-----(BEGIN|END)[A-Z ]*-----", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          lines = [body[i:i + 64] for i in range(0, len(body), 64)]
          open(sys.argv[1], "w").write("-----BEGIN PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END PRIVATE KEY-----\n")
          PY
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/key.p8" >> "$GITHUB_ENV"
      - run: pip install pyjwt cryptography requests
      - name: Create group, link and submit for beta review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number || '4' }}
        run: python3 scripts/asc/testflight_public_link.py
