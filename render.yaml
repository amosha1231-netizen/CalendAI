# Render.com deployment configuration
services:
  - type: web
    name: calendai
    env: node
    region: frankfurt  # קרוב לישראל
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: PORT
        value: "10000"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LEMON_SQUEEZY_API_KEY
        sync: false
      - key: LEMON_SQUEEZY_WEBHOOK_SECRET
        sync: false
      - key: LEMON_SQUEEZY_STORE_ID
        sync: false
      - key: LEMON_SQUEEZY_VARIANT_ID  # optional, defaults to the credits pack variant
        sync: false
      - key: LEMON_SQUEEZY_PRO_VARIANT_ID  # monthly Pro subscription variant (see docs/payments.md)
        sync: false
      - key: PRO_MONTHLY_CREDITS  # optional, AI credits per Pro month, default 1000
        sync: false
      - key: REVENUECAT_WEBHOOK_AUTH  # Authorization header value set on the RevenueCat webhook
        sync: false
      - key: REVENUECAT_SECRET_KEY  # RevenueCat secret API key (v1), used by /api/payments/revenuecat-sync
        sync: false
      - key: SESSION_SECRET
        generateValue: true  # יווצר אוטומטית
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: "https://calendai.org"
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      # Web Push for reminders: generate once with `npx web-push generate-vapid-keys`
      # and keep them stable (changing them breaks existing subscriptions).
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
