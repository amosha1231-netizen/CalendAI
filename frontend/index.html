<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14181A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CalendAI" />
    <meta name="description" content="CalendAI - פירוש לוח זמנים חכם באמצעות AI" />
    <title>CalendAI - Smart Schedule Parser</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <!-- Ledger & Index brand type: Rubik (display/he), Work Sans (en body), Noto Sans Hebrew (he body), JetBrains Mono (dates/times/prices) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800;900&family=Work+Sans:wght@400;500;600&family=Noto+Sans+Hebrew:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
    <!-- Capacitor-specific: disable zoom on native -->
    <script>
      // Wait for Capacitor to be ready before app starts
      window.addEventListener('DOMContentLoaded', function() {
        if (window.Capacitor) {
          document.documentElement.classList.add('capacitor-native');
          // The native app keeps a fixed scale; the website allows pinch-zoom (accessibility).
          var vp = document.querySelector('meta[name="viewport"]');
          if (vp) vp.setAttribute('content', vp.getAttribute('content') + ', maximum-scale=1.0, user-scalable=no');
        }
      });
    </script>
    <!-- Loader styles live here (not in index.css) so the boot splash is styled on first paint -->
    <style>
      /* ──────────────────────────────────────────── */
      /* LuxuryLoader + boot splash (#app-splash)     */
      /* ──────────────────────────────────────────── */
      .luxury-loader-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0a0c;
        overflow: hidden;
      }

      .luxury-loader-overlay.fade-out {
        animation: luxury-fade-out 0.5s ease-out forwards;
      }

      @keyframes luxury-fade-out {
        from { opacity: 1; }
        to { opacity: 0; pointer-events: none; }
      }

      .luxury-loader-bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 40%, rgba(0, 242, 254, 0.04) 0%, transparent 60%),
                    radial-gradient(ellipse at 50% 60%, rgba(79, 172, 254, 0.04) 0%, transparent 60%);
        pointer-events: none;
      }

      .luxury-loader-glow {
        position: absolute;
        width: 280px;
        height: 280px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 242, 254, 0.15) 0%, rgba(79, 172, 254, 0.08) 40%, transparent 70%);
        animation: luxury-breathe 3s ease-in-out infinite;
        filter: blur(40px);
        pointer-events: none;
      }

      @keyframes luxury-breathe {
        0%, 100% {
          transform: scale(0.85);
          opacity: 0.6;
        }
        50% {
          transform: scale(1.15);
          opacity: 1;
        }
      }

      .luxury-loader-core {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1;
      }

      .luxury-loader-orb {
        position: absolute;
        width: 160px;
        height: 160px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, rgba(0, 242, 254, 0.1), rgba(79, 172, 254, 0.05) 60%, transparent);
        animation: luxury-breathe-orb 3s ease-in-out infinite;
        pointer-events: none;
      }

      @keyframes luxury-breathe-orb {
        0%, 100% {
          transform: scale(0.9);
          opacity: 0.5;
        }
        50% {
          transform: scale(1.1);
          opacity: 0.8;
        }
      }

      .luxury-loader-title {
        font-size: 3rem;
        font-weight: 200;
        letter-spacing: -0.03em;
        color: rgba(255, 255, 255, 0.7);
        font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        z-index: 2;
        text-shadow: 0 0 40px rgba(0, 242, 254, 0.15);
        animation: luxury-title-pulse 3s ease-in-out infinite;
      }

      @keyframes luxury-title-pulse {
        0%, 100% {
          opacity: 0.7;
          text-shadow: 0 0 40px rgba(0, 242, 254, 0.15);
        }
        50% {
          opacity: 1;
          text-shadow: 0 0 60px rgba(0, 242, 254, 0.3), 0 0 80px rgba(79, 172, 254, 0.15);
        }
      }

      .luxury-loader-status-wrapper {
        position: absolute;
        bottom: 80px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        z-index: 1;
      }

      .luxury-loader-status {
        direction: ltr;
        unicode-bidi: isolate;
        font-size: 0.65rem;
        font-weight: 400;
        letter-spacing: 0.35em;
        color: rgba(255, 255, 255, 0.25);
        font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        animation: luxury-status-fade 3s ease-in-out infinite;
      }

      @keyframes luxury-status-fade {
        0%, 100% {
          opacity: 0.25;
        }
        50% {
          opacity: 0.5;
        }
      }

      #app-splash {
        z-index: 100000;
      }
    </style>
  </head>
  <body>
    <!-- Boot splash: identical to <LuxuryLoader />, so React's own loaders continue it
         seamlessly. It sits outside #root and fades out once the first real screen
         has rendered (see src/utils/splash.js). -->
    <div id="app-splash" class="luxury-loader-overlay" aria-hidden="true">
      <div class="luxury-loader-bg"></div>
      <div class="luxury-loader-glow"></div>
      <div class="luxury-loader-core">
        <div class="luxury-loader-orb"></div>
        <h1 class="luxury-loader-title">CalendAI</h1>
      </div>
      <div class="luxury-loader-status-wrapper">
        <span class="luxury-loader-status">OPTIMIZING YOUR SCHEDULE...</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
